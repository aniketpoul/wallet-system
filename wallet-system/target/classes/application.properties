spring.application.name=wallet-system

# ---------- H2 Database ----------
spring.datasource.url=jdbc:h2:file:./data/walletdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# 256-bit+ secret used to sign JWT tokens. Override via env var in production.
jwt.secret=${JWT_SECRET:ThisIsADevOnlySecretKeyPleaseChangeItInProd123456}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---------- Server ----------
server.port=8081

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.com.wallet.system=DEBUG
